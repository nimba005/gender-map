# /etc/nginx/sites-available/gender-map
# HTTP only as written; `certbot --nginx -d gender-map.52.147.204.253.sslip.io` adds the HTTPS parts.
server {
    listen 80;
    listen [::]:80;
    server_name gender-map.52.147.204.253.sslip.io;

    client_max_body_size 50m;

    # Map data and boundaries compress to roughly a quarter of their size.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json application/octet-stream text/css application/javascript text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
