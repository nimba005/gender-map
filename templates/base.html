<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AGNES Gender Hotspot Map{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('home') }}" aria-label="Open Gender Hotspot Map home">
      <span class="brand-mark">A</span>
      <span>
        <strong>AGNES</strong>
        <small>Gender Hotspot Map</small>
      </span>
    </a>

    <nav class="nav-links" aria-label="Main navigation">
      <a href="{{ url_for('home') }}" class="{% if page == 'home' %}is-active{% endif %}">Overview</a>
      <a href="{{ url_for('map_page') }}" class="{% if page == 'map' %}is-active{% endif %}">Interactive Map</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span>AGNES Gender Hotspot Map</span>
    <span>Kenya, Uganda, Botswana, and Ghana study workspace</span>
  </footer>

  {% block body_scripts %}{% endblock %}
</body>
</html>
