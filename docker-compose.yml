# Full stack for the AGNES Gender Hotspot Map: app + Postgres + Redis + Caddy (HTTPS).
#
#   cp .env.docker.example .env.docker   # then edit the values
#   docker compose --env-file .env.docker up -d --build
#
# Caddy serves SITE_ADDRESS. Use a hostname (for example gender-map.1.2.3.4.sslip.io) to get an
# automatic HTTPS certificate, or ":80" for plain HTTP on a machine without a public name.

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env.docker}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env.docker}
      DATABASE_URL: postgresql://gender_map:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.docker}@db:5432/gender_map
      POSTGRES_FALLBACK_TO_SQLITE: "0"
      REDIS_URL: redis://redis:6379/0
      BEHIND_PROXY: ${BEHIND_PROXY:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    volumes:
      - uploads:/app/instance
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gender_map
      POSTGRES_USER: gender_map
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gender_map -d gender_map"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
